[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-utils"
version = "0.3.0"
description = "Local GUI + library for bulk-managing Hugging Face repos and LeRobot datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jellyho" }]

# The library half (hfutil) is deliberately light: pyarrow/pandas only, so other
# projects can depend on it without pulling in a web server or torch.
dependencies = [
    "huggingface_hub>=0.34,<0.36",
    "pyarrow>=15",
    "pandas>=2.0",
]

# These three ARE the app's install list -- `run.sh` asks uv for all of them. They stay
# extras rather than hard dependencies so a project that only wants `hfutil.dataset` gets
# pyarrow/pandas and no web server, no torch.
[project.optional-dependencies]
# Everything needed to run the local web GUI (`python -m backend.main`).
app = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
# LeRobot dataset editing (delete/split/merge) needs lerobot itself, which pulls torch.
lerobot = [
    "lerobot==0.4.4",
]
# Video probing + a bundled ffmpeg for episode rendering.
video = [
    "av>=12",
    "imageio-ffmpeg>=0.5",
]

[project.urls]
Homepage = "https://github.com/jellyho/hf-utils"

[tool.setuptools.packages.find]
include = ["hfutil*"]
