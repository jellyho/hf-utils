<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HF Util</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤗</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🤗</span>
      <span>HF&nbsp;Util</span>
    </div>
    <div class="who" id="who">…</div>
    <button class="btn ghost" id="refreshBtn" title="Reload current tab">↻ Refresh</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="model">Models</button>
    <button class="tab" data-tab="dataset">Datasets</button>
    <button class="tab" data-tab="collection">Collections</button>
    <button class="tab" data-tab="transfer">Transfer</button>
  </nav>

  <!-- Repo view (models & datasets share this) -->
  <section class="view" id="repoView">
    <div class="toolbar">
      <input class="search" id="repoSearch" type="search" placeholder="Filter by name…" />
      <select class="select" id="repoVisFilter" title="Visibility filter">
        <option value="all">All</option>
        <option value="public">Public only</option>
        <option value="private">Private only</option>
      </select>
      <select class="select" id="repoSort" title="Sort">
        <option value="modified">Recently modified</option>
        <option value="name">Name (A→Z)</option>
        <option value="downloads">Most downloads</option>
        <option value="likes">Most likes</option>
      </select>
      <span class="spacer"></span>
      <span class="count" id="repoCount"></span>
      <button class="btn danger" id="repoDeleteBtn" disabled>Delete selected</button>
    </div>

    <div class="tablewrap">
      <table class="grid" id="repoTable">
        <thead>
          <tr>
            <th class="c-check"><input type="checkbox" id="repoSelectAll" title="Select all filtered" /></th>
            <th class="c-name">Name</th>
            <th class="c-vis">Visibility</th>
            <th class="c-num">Downloads</th>
            <th class="c-num">Likes</th>
            <th class="c-date">Modified</th>
            <th class="c-act">Actions</th>
          </tr>
        </thead>
        <tbody id="repoBody"></tbody>
      </table>
      <div class="empty" id="repoEmpty" hidden></div>
    </div>
  </section>

  <!-- Collections view -->
  <section class="view" id="collectionView" hidden>
    <div class="toolbar">
      <input class="search" id="colSearch" type="search" placeholder="Filter by title…" />
      <span class="spacer"></span>
      <span class="count" id="colCount"></span>
      <button class="btn danger" id="colDeleteBtn" disabled>Delete selected</button>
    </div>
    <div class="collections" id="colList"></div>
    <div class="empty" id="colEmpty" hidden></div>
  </section>

  <!-- Transfer view (download / upload) -->
  <section class="view" id="transferView" hidden>
    <div class="transfer-grid">
      <div class="panel">
        <h3>⤓ Download from Hub</h3>
        <label class="field"><span>Repo ID</span>
          <input id="dlRepoId" class="search" placeholder="jellyho/my-dataset" autocomplete="off" /></label>
        <label class="field"><span>Type</span>
          <select id="dlRepoType" class="select">
            <option value="dataset">dataset</option>
            <option value="model">model</option>
          </select></label>
        <label class="field"><span>Local folder (relative paths land in the repo dir)</span>
          <div class="path-row">
            <input id="dlLocalDir" class="search" placeholder="downloads/my-dataset" autocomplete="off" />
            <button class="btn" type="button" id="dlBrowse">Browse…</button>
          </div></label>
        <label class="checkline">
          <input type="checkbox" id="dlLerobot" /><span>Use LeRobot API</span>
          <span class="hint" id="dlDetect"></span></label>
        <button class="btn primary" id="dlStart">Start download</button>
      </div>

      <div class="panel">
        <h3>⤒ Upload to Hub</h3>
        <label class="field"><span>Local folder</span>
          <div class="path-row">
            <input id="upLocalDir" class="search" placeholder="/path/to/dataset" autocomplete="off" />
            <button class="btn" type="button" id="upBrowse">Browse…</button>
          </div></label>
        <label class="field"><span>Target repo ID</span>
          <input id="upRepoId" class="search" placeholder="jellyho/my-dataset" autocomplete="off" /></label>
        <label class="field"><span>Type</span>
          <select id="upRepoType" class="select">
            <option value="dataset">dataset</option>
            <option value="model">model</option>
          </select></label>
        <label class="checkline"><input type="checkbox" id="upPrivate" /><span>Private</span></label>
        <label class="checkline">
          <input type="checkbox" id="upLerobot" /><span>Use LeRobot API</span>
          <span class="hint" id="upDetect"></span></label>
        <button class="btn primary" id="upStart">Start upload</button>
      </div>
    </div>

    <div class="jobs-head">
      <h3>Jobs</h3>
      <span class="count" id="jobsCount"></span>
    </div>
    <div class="jobs" id="jobsList"></div>
    <div class="empty" id="jobsEmpty">No transfer jobs yet.</div>
  </section>

  <!-- Confirm delete modal -->
  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal">
      <h3 id="confirmTitle">Confirm deletion</h3>
      <p class="modal-sub" id="confirmSub"></p>
      <ul class="confirm-list" id="confirmList"></ul>
      <p class="warn">⚠ This is permanent and cannot be undone. Type <b>DELETE</b> to confirm.</p>
      <input class="search" id="confirmInput" placeholder="DELETE" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancel">Cancel</button>
        <button class="btn danger" id="confirmOk" disabled>Delete permanently</button>
      </div>
    </div>
  </div>

  <!-- Edit collection modal -->
  <div class="modal-backdrop" id="editColModal" hidden>
    <div class="modal">
      <h3>Edit collection</h3>
      <label class="field">
        <span>Title</span>
        <input class="search" id="editColTitle" />
      </label>
      <label class="field">
        <span>Description</span>
        <textarea class="search" id="editColDesc" rows="3"></textarea>
      </label>
      <label class="checkline">
        <input type="checkbox" id="editColPrivate" /> <span>Private</span>
      </label>
      <div class="modal-actions">
        <button class="btn ghost" id="editColCancel">Cancel</button>
        <button class="btn primary" id="editColSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Folder picker -->
  <div class="modal-backdrop" id="fsModal" hidden>
    <div class="modal fs-modal">
      <h3 id="fsTitle">Choose a folder</h3>
      <div class="fs-bar">
        <button class="btn tiny ghost" type="button" id="fsRoot" title="Top level">⌆</button>
        <button class="btn tiny ghost" type="button" id="fsHome" title="Home">⌂</button>
        <button class="btn tiny ghost" type="button" id="fsUp" title="Up one level">↑</button>
        <input class="search fs-path" id="fsPath" readonly />
      </div>
      <div class="fs-list" id="fsList"></div>
      <div class="fs-info" id="fsInfo"></div>
      <div class="fs-newrow">
        <input class="search" id="fsNewName" placeholder="new-folder-name" autocomplete="off" />
        <button class="btn tiny" type="button" id="fsMkdir">+ New folder</button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" type="button" id="fsCancel">Cancel</button>
        <button class="btn primary" type="button" id="fsSelect">Select this folder</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
